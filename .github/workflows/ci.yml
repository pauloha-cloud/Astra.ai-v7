name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate temporary vulnerability exception
        run: node security/atve/validate-atve.mjs

      - name: Dependency security audit
        run: npm exec -- audit-ci --config audit-ci.json

      - name: Lint
        run: npm run lint

      - name: Firebase Web build validator unit tests
        run: node --test tests/verify-firebase-web-build.test.mjs

      # CI fixture only. The actual DEV key must be supplied by an approved
      # deployment workflow. Never deploy this CI bundle.
      - name: Production build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-firebase-web-key-not-for-deployment
        run: |
          node scripts/verify-firebase-web-build.mjs pre
          npm run build
          node scripts/verify-firebase-web-build.mjs post

      - name: Supadata native transcript tests
        run: npm run test:supadata-transcript

      - name: YouTube transcript resolver tests
        run: npm run test:youtube-transcript-resolver

      - name: Rate limiter tests
        run: npm run test:rate-limit

      - name: Firestore Rules tests
        run: npm run test:firestore-rules
